system {
    host-name fabric-01;
    services {
        netconf {
            ssh;
        }
        ssh;
    }
    syslog  {
        user * {
            any emergency;
        }
        file messages {
            any notice;
        }
        file cli-commands {
            interactive-commands any;
            explicit-priority;
        }
        time-format millisecond;
    }
    ntp {
        server <redacted-address>;
    }
}
