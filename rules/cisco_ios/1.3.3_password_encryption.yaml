id: "1.3.3"
title: "Ensure service password-encryption is configured"
description: "Checks for the Cisco IOS service password-encryption baseline command."
rationale: "This legacy obfuscation is not a substitute for secret-form credentials, but is a directly observable CIS baseline setting."
benchmark: "CIS Cisco IOS Benchmark v4.1.0 (public transcription)"
benchmark_version: "v4.1.0"
level: 1
profile: [network_device]
device: {vendor: Cisco, platform: IOS, config_format: running-config-or-reference-config}
automated: true
severity: medium
checks:
  - {type: config_grep, pattern: "^service password-encryption$", op: matches}
remediation: "Configure service password-encryption. Continue using secret-form credentials for accounts and enable access."
source: "CIS Cisco IOS Benchmark v4.1.0 public transcription, control 1.3.3; https://github.com/ynotbhatc/rego_policy_libraries/blob/50b502c7e5044b2568394527940298bef518347f/benchmarks/cis/network/cisco/cis_security.rego; corpus oracle tests/fixtures/network/cisco_ios/manual_rule_expectations.json"
framework_mappings:
  - {framework: "NIST SP 800-53", version: "Rev. 5", control_id: "IA-5", relationship: "supporting", source: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"}
