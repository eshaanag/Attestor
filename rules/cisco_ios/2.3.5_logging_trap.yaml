id: "2.3.5"
title: "Ensure logging trap is configured"
description: "Checks for a logging trap severity configuration."
rationale: "A configured trap threshold controls which events are forwarded to the remote audit destination."
benchmark: "CIS Cisco IOS Benchmark v4.1.0 (public transcription)"
benchmark_version: "v4.1.0"
level: 1
profile: [network_device]
device: {vendor: Cisco, platform: IOS, config_format: running-config-or-reference-config}
automated: true
severity: medium
checks:
  - {type: config_grep, pattern: "^logging trap\\s+(informational|warnings|notifications|errors|critical|alerts|emergencies)$", op: matches}
remediation: "Configure an organization-approved remote logging threshold, for example: logging trap informational."
source: "CIS Cisco IOS Benchmark v4.1.0 public transcription, control 2.3.5; https://github.com/ynotbhatc/rego_policy_libraries/blob/50b502c7e5044b2568394527940298bef518347f/benchmarks/cis/network/cisco/cisco_security.rego; corpus oracle tests/fixtures/network/cisco_ios/manual_rule_expectations.json"
framework_mappings:
  - {framework: "NIST SP 800-53", version: "Rev. 5", control_id: "AU-2", relationship: "supporting", source: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"}
