id: "2.6.1"
title: "Ensure SSH version 2 is configured"
description: "Checks for explicit SSH version 2 configuration."
rationale: "SSH version 2 avoids the obsolete SSHv1 protocol."
benchmark: "CIS Cisco IOS Benchmark v4.1.0 (public transcription)"
benchmark_version: "v4.1.0"
level: 1
profile: [network_device]
device: {vendor: Cisco, platform: IOS, config_format: running-config-or-reference-config}
automated: true
severity: high
checks:
  - {type: config_grep, pattern: "^ip ssh version 2$", op: matches}
remediation: "Configure ip ssh version 2 and verify VTY transport separately; this check does not prove every VTY range is SSH-only."
source: "CIS Cisco IOS Benchmark v4.1.0 public transcription, control 2.6.1; https://raw.githubusercontent.com/ynotbhatc/rego_policy_libraries/50b502c7e5044b2568394527940298bef518347f/benchmarks/cis/network/cisco/cisco_security.rego; corpus oracle tests/fixtures/network/cisco_ios/manual_rule_expectations.json"
framework_mappings:
  - {framework: "NIST SP 800-53", version: "Rev. 5", control_id: "SC-8", relationship: "direct", source: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"}
