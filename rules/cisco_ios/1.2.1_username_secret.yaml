id: "1.2.1"
title: "Ensure a local username secret is configured"
description: "Checks for a local Cisco IOS username entry using the secret form rather than a cleartext password."
rationale: "Secret-form credentials reduce exposure when configuration text is readable. This presence check does not prove every local account is compliant."
benchmark: "CIS Cisco IOS Benchmark v4.1.0 (public transcription)"
benchmark_version: "v4.1.0"
level: 1
profile: [network_device]
device:
  vendor: Cisco
  platform: IOS
  config_format: running-config-or-reference-config
automated: true
severity: high
checks:
  - type: config_grep
    pattern: "^username\\s+\\S+.*\\bsecret\\b"
    op: matches
remediation: "Configure each local account with the Cisco IOS secret form: username <name> privilege <level> secret <strong-secret>. Review every local account manually."
source: "CIS Cisco IOS Benchmark v4.1.0 public transcription, control 1.2.1; https://github.com/ynotbhatc/rego_policy_libraries/blob/50b502c7e5044b2568394527940298bef518347f/benchmarks/cis/network/cisco/cis_security.rego; corpus oracle tests/fixtures/network/cisco_ios/manual_rule_expectations.json"
framework_mappings:
  - framework: "NIST SP 800-53"
    version: "Rev. 5"
    control_id: "IA-5"
    relationship: "supporting"
    source: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
