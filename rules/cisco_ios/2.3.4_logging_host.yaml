id: "2.3.4"
title: "Ensure a remote logging host is configured"
description: "Checks for at least one remote syslog destination."
rationale: "Remote logging preserves records if the device is unavailable or its local buffer is overwritten."
benchmark: "CIS Cisco IOS Benchmark v4.1.0 (public transcription)"
benchmark_version: "v4.1.0"
level: 1
profile: [network_device]
device: {vendor: Cisco, platform: IOS, config_format: running-config-or-reference-config}
automated: true
severity: high
checks:
  - {type: config_grep, pattern: "^logging host\\s+\\S+", op: matches}
remediation: "Configure a trusted remote syslog destination: logging host <syslog-address>. Validate transport, retention, and destination ACLs separately."
source: "CIS Cisco IOS Benchmark v4.1.0 public transcription, control 2.3.4; https://github.com/ynotbhatc/rego_policy_libraries/blob/50b502c7e5044b2568394527940298bef518347f/benchmarks/cis/network/cisco/cisco_security.rego; corpus oracle tests/fixtures/network/cisco_ios/manual_rule_expectations.json"
framework_mappings:
  - {framework: "NIST SP 800-53", version: "Rev. 5", control_id: "AU-9", relationship: "supporting", source: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"}
