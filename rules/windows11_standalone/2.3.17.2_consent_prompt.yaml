id: "2.3.17.2"
title: "Ensure 'UAC: Behavior of elevation prompt for administrators' is set to 'Prompt for consent on the secure desktop'"
rationale: >
  Elevation prompts on the secure desktop prevent UI spoofing.
benchmark: "CIS Microsoft Windows 11 Standalone Benchmark"
benchmark_version: "v3.0.0"
level: 1
profile:
  - standalone
automated: true
severity: high
checks:
  - type: registry
    path: "HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\System"
    name: ConsentPromptBehaviorAdmin
    expected: "2"
    op: equals
remediation: >
  Refer to CIS Benchmark section 2.3.17.2 for detailed remediation steps.
source: >
  Control ID 2.3.17.2, cross-referenced via ansible-lockdown/Windows-11-CIS (cis_2.3.17.x, which targets CIS Windows 11 benchmark v3.0.0). NOTE: current CIS Windows 11 Standalone benchmark is v5.0.0; no direct PDF access. Registry VM-verified on Windows 11 Pro (192.168.64.4, build 26200) 2026-08-08.
