id: "2.3.4.2"
title: "Ensure 'Domain member: Maximum machine account password age' is 30 days or less"
benchmark: "CIS Microsoft Windows 11 Standalone Benchmark"
benchmark_version: "v3.0.0"
level: 1
profile:
  - standalone
automated: true
severity: medium
checks:
  - type: registry
    path: "HKLM:\\System\\CurrentControlSet\\Services\\Netlogon\\Parameters"
    name: MaximumPasswordAge
    expected: "30"
    op: equals
remediation: >
  Set registry value: HKLM:\System\CurrentControlSet\Services\Netlogon\Parameters\MaximumPasswordAge = 30 (REG_DWORD). Via PowerShell: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Services\Netlogon\Parameters' -Name 'MaximumPasswordAge' -Value 30 -Type DWord -Force
source: >
  Control ID 2.3.4.2, cross-referenced via ansible-lockdown/Windows-11-CIS (CIS Windows 11 benchmark v3.0.0). NOTE: current is v5.0.0; no direct PDF access. Registry VM-verified on Windows 11 Pro (192.168.64.4, build 26200) 2026-08-15.
