id: "2.3.10.5"
title: "Ensure 'Network access: Let Everyone permissions apply to anonymous users' is set to Disabled"
description: >
  When disabled, anonymous users do not inherit the Everyone group permissions.
rationale: >
  If anonymous users inherit Everyone permissions, they can access any resource granted to Everyone.
benchmark: "CIS Microsoft Windows 11 Standalone Benchmark"
benchmark_version: "v3.0.0"
level: 1
profile:
  - standalone
automated: true
severity: high
checks:
  - type: registry
    path: "HKLM:\\System\\CurrentControlSet\\Control\\Lsa"
    name: EveryoneIncludesAnonymous
    expected: "0"
    op: equals
remediation: >
  Set HKLM\System\CurrentControlSet\Control\Lsa\EveryoneIncludesAnonymous (REG_DWORD) = 0.
source: >
  Control ID 2.3.10.5, registry path, and expected value (EveryoneIncludesAnonymous=0) cross-referenced via ansible-lockdown/Windows-11-CIS (tasks/section_2/cis_2.3.10.x.yml, which targets CIS Windows 11 benchmark v3.0.0). NOTE: current CIS Windows 11 Standalone benchmark is v5.0.0 (confirmed on cisecurity.org); the ansible-lockdown ref targets v3.0.0 and control numbering may have shifted — no direct PDF access to confirm. Registry mechanics VM-verified on Windows 11 Pro (192.168.64.4, build 26200) 2026-08-08.
