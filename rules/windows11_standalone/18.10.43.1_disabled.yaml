id: "18.10.43.1"
title: "Ensure 'Configure Automatic Updates' is not Disabled"
benchmark: "CIS Microsoft Windows 11 Standalone Benchmark"
benchmark_version: "v3.0.0"
level: 1
profile:
  - standalone
automated: true
severity: medium
checks:
  - type: registry
    path: "HKLM:\\Software\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU"
    name: NoAutoUpdate
    expected: "0"
    op: equals
remediation: >
  Set registry value: HKLM:\Software\Policies\Microsoft\Windows\WindowsUpdate\AU\NoAutoUpdate = 0 (REG_DWORD). Via PowerShell: Set-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Windows\WindowsUpdate\AU' -Name 'NoAutoUpdate' -Value 0 -Type DWord -Force
source: >
  Control ID 18.10.43.1, cross-referenced via ansible-lockdown/Windows-11-CIS (CIS Windows 11 benchmark v3.0.0). NOTE: current is v5.0.0; no direct PDF access. Registry VM-verified on Windows 11 Pro (192.168.64.4, build 26200) 2026-08-15.
