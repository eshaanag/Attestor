id: "2.3.9.2"
title: "Ensure 'Microsoft network server: Digitally sign communications (if client agrees)' is Enabled"
rationale: >
  Enables opportunistic SMB signing for connecting clients.
benchmark: "CIS Microsoft Windows 11 Standalone Benchmark"
benchmark_version: "v3.0.0"
level: 1
profile:
  - standalone
automated: true
severity: medium
checks:
  - type: registry
    path: "HKLM:\\System\\CurrentControlSet\\Services\\LanManServer\\Parameters"
    name: EnableSecuritySignature
    expected: "1"
    op: equals
remediation: >
  Refer to CIS Benchmark section 2.3.9.2 for detailed remediation steps.
source: >
  Control ID 2.3.9.2, cross-referenced via ansible-lockdown/Windows-11-CIS (cis_2.3.9.x, which targets CIS Windows 11 benchmark v3.0.0). NOTE: current CIS Windows 11 Standalone benchmark is v5.0.0; no direct PDF access. Registry VM-verified on Windows 11 Pro (192.168.64.4, build 26200) 2026-08-08.
