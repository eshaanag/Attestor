id: "17.1.1"
title: "Ensure 'Audit Credential Validation' is set to 'Success and Failure'"
description: >
  This subcategory audits credentials validation events for user account logon events.
rationale: >
  Without auditing credential validation, failed logon attempts (brute-force attacks) go undetected in security logs.
benchmark: "CIS Microsoft Windows 11 Standalone Benchmark"
benchmark_version: "v3.0.0"
level: 1
profile:
  - standalone
automated: true
severity: medium
checks:
  - type: audit_policy
    subcategory: "Credential Validation"
    expected: "Success and Failure"
    op: equals
remediation: >
  Via Group Policy: Computer Configuration > Windows Settings > Security Settings > Advanced Audit Policy > Account Logon > 'Audit Credential Validation' = Success and Failure. Or: auditpol /set /subcategory:"Credential Validation" /success:enable /failure:enable
source: >
  Control ID 17.1.1, cross-referenced via ansible-lockdown/Windows-11-CIS (tasks/section_17/cis_17.1.x.yml, which targets CIS Windows 11 benchmark v3.0.0). NOTE: current CIS Windows 11 Standalone benchmark is v5.0.0 (confirmed on cisecurity.org); the ansible-lockdown ref targets v3.0.0 and control numbering may have shifted — no direct PDF access to confirm. Auditpol mechanics VM-verified on Windows 11 Pro (192.168.64.4, build 26200) 2026-08-08.
