id: "18.9.5.2"
title: "Ensure 'SmartScreen Filter Level' is set to Block"
benchmark: "CIS Microsoft Windows 11 Standalone Benchmark"
benchmark_version: "v3.0.0"
level: 2
profile:
  - standalone
automated: true
severity: medium
checks:
  - type: registry
    path: "HKLM:\\Software\\Policies\\Microsoft\\Windows\\System"
    name: ShellSmartScreenLevel
    expected: "Block"
    op: equals
remediation: >
  Set registry value: HKLM:\Software\Policies\Microsoft\Windows\System\ShellSmartScreenLevel = Block (REG_DWORD). Via PowerShell: Set-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Windows\System' -Name 'ShellSmartScreenLevel' -Value Block -Type DWord -Force
source: >
  Control ID 18.9.5.2, cross-referenced via ansible-lockdown/Windows-11-CIS (CIS Windows 11 benchmark v3.0.0). NOTE: current is v5.0.0; no direct PDF access. Registry VM-verified on Windows 11 Pro (192.168.64.4, build 26200) 2026-08-15.
