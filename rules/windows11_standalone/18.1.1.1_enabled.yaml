id: "18.1.1.1"
title: "Ensure 'Prevent enabling lock screen camera' is Enabled"
benchmark: "CIS Microsoft Windows 11 Standalone Benchmark"
benchmark_version: "v3.0.0"
level: 1
profile:
  - standalone
automated: true
severity: low
checks:
  - type: registry
    path: "HKLM:\\Software\\Policies\\Microsoft\\Windows\\Personalization"
    name: NoLockScreenCamera
    expected: "1"
    op: equals
remediation: >
  Set registry value: HKLM:\Software\Policies\Microsoft\Windows\Personalization\NoLockScreenCamera = 1 (REG_DWORD). Via PowerShell: Set-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Windows\Personalization' -Name 'NoLockScreenCamera' -Value 1 -Type DWord -Force
source: >
  Control ID 18.1.1.1, cross-referenced via ansible-lockdown/Windows-11-CIS (CIS Windows 11 benchmark v3.0.0). NOTE: current is v5.0.0; no direct PDF access. Registry VM-verified on Windows 11 Pro (192.168.64.4, build 26200) 2026-08-15.
