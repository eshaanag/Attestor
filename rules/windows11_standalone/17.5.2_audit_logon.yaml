id: "17.5.2"
title: "Ensure 'Audit Logon' is set to 'Success and Failure'"
rationale: >
  Auditing both successful and failed logons detects brute-force attacks and tracks access.
benchmark: "CIS Microsoft Windows 11 Standalone Benchmark"
benchmark_version: "v3.0.0"
level: 1
profile:
  - standalone
automated: true
severity: high
checks:
  - type: audit_policy
    subcategory: "Logon"
    expected: "Success and Failure"
    op: equals
remediation: >
  Run: auditpol /set /subcategory:"Logon" /success:enable /failure:enable
source: >
  Control ID 17.5.2, cross-referenced via ansible-lockdown/Windows-11-CIS (cis_17.5.x, which targets CIS Windows 11 benchmark v3.0.0). NOTE: current CIS Windows 11 Standalone benchmark is v5.0.0; no direct PDF access. Auditpol VM-verified on Windows 11 Pro (192.168.64.4, build 26200) 2026-08-08.
