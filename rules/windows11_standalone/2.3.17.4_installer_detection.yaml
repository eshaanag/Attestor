id: "2.3.17.4"
title: "Ensure 'UAC: Detect application installations and prompt for elevation' is Enabled"
rationale: >
  Detects installer-like behavior and elevates appropriately.
benchmark: "CIS Microsoft Windows 11 Standalone Benchmark"
benchmark_version: "v3.0.0"
level: 1
profile:
  - standalone
automated: true
severity: medium
checks:
  - type: registry
    path: "HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\System"
    name: EnableInstallerDetection
    expected: "1"
    op: equals
remediation: >
  Set registry value: HKLM:\Software\Microsoft\Windows\CurrentVersion\Policies\System\EnableInstallerDetection = 1 (REG_DWORD). Via PowerShell: Set-ItemProperty -Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'EnableInstallerDetection' -Value 1 -Type DWord -Force
source: >
  Control ID 2.3.17.4, cross-referenced via ansible-lockdown/Windows-11-CIS (cis_2.3.17.x, which targets CIS Windows 11 benchmark v3.0.0). NOTE: current CIS Windows 11 Standalone benchmark is v5.0.0; no direct PDF access. Registry VM-verified on Windows 11 Pro (192.168.64.4, build 26200) 2026-08-08.
