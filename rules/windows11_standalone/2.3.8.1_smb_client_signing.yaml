id: "2.3.8.1"
title: "Ensure 'Microsoft network client: Digitally sign communications (always)' is Enabled"
rationale: >
  SMB signing prevents man-in-the-middle attacks on network file shares.
benchmark: "CIS Microsoft Windows 11 Standalone Benchmark"
benchmark_version: "v3.0.0"
level: 1
profile:
  - standalone
automated: true
severity: high
checks:
  - type: registry
    path: "HKLM:\\System\\CurrentControlSet\\Services\\LanmanWorkstation\\Parameters"
    name: RequireSecuritySignature
    expected: "1"
    op: equals
remediation: >
  Refer to CIS Benchmark section 2.3.8.1 for detailed remediation steps.
source: >
  Control ID 2.3.8.1, cross-referenced via ansible-lockdown/Windows-11-CIS (cis_2.3.8.x, which targets CIS Windows 11 benchmark v3.0.0). NOTE: current CIS Windows 11 Standalone benchmark is v5.0.0; no direct PDF access. Registry VM-verified on Windows 11 Pro (192.168.64.4, build 26200) 2026-08-08.
