id: "1.1.3"
title: "Ensure 'Minimum password age' is at least 1 day"
benchmark: "CIS Microsoft Windows 11 Standalone Benchmark"
benchmark_version: "v3.0.0"
level: 1
profile:
  - standalone
automated: true
severity: medium
checks:
  - type: account_policy
    section: "System Access"
    key: MinimumPasswordAge
    expected: "1"
    op: equals
remediation: >
  Via Group Policy: Computer Configuration > Windows Settings > Security Settings > Account Policies. Set MinimumPasswordAge = 1. Or export/edit with secedit.
source: >
  Control ID 1.1.3, cross-referenced via ansible-lockdown/Windows-11-CIS (CIS Windows 11 benchmark v3.0.0). NOTE: current is v5.0.0; no direct PDF access. Secedit VM-verified on Windows 11 Pro (192.168.64.4, build 26200) 2026-08-15.
