id: "18.10.43.2"
title: "Ensure 'Schedule install day' is configured"
benchmark: "CIS Microsoft Windows 11 Standalone Benchmark"
benchmark_version: "v3.0.0"
level: 1
profile:
  - standalone
automated: true
severity: low
checks:
  - type: registry
    path: "HKLM:\\Software\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU"
    name: ScheduledInstallDay
    expected: "0"
    op: equals
remediation: >
  Set registry value: HKLM:\Software\Policies\Microsoft\Windows\WindowsUpdate\AU\ScheduledInstallDay = 0 (REG_DWORD). Via PowerShell: Set-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Windows\WindowsUpdate\AU' -Name 'ScheduledInstallDay' -Value 0 -Type DWord -Force
