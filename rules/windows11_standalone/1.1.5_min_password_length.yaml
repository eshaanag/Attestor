id: "1.1.5"
title: "Ensure 'Minimum password length' is set to 14 or more characters"
description: >
  This policy setting determines the minimum number of characters a password must contain.
rationale: >
  Short passwords are vulnerable to brute-force and dictionary attacks. A minimum of 14 characters significantly increases the time required for offline cracking.
benchmark: "CIS Microsoft Windows 11 Standalone Benchmark"
benchmark_version: "v3.0.0"
level: 1
profile:
  - standalone
automated: true
severity: high
checks:
  - type: account_policy
    section: "System Access"
    key: MinimumPasswordLength
    expected: "14"
    op: equals
remediation: >
  Via Group Policy: Computer Configuration > Windows Settings > Security Settings > Account Policies > Password Policy > 'Minimum password length' = 14 or more.
source: >
  Control ID 1.1.5, cross-referenced via ansible-lockdown/Windows-11-CIS (tasks/section_1/cis_1.1.x.yml, which targets CIS Windows 11 benchmark v3.0.0). NOTE: current CIS Windows 11 Standalone benchmark is v5.0.0 (confirmed on cisecurity.org); the ansible-lockdown ref targets v3.0.0 and control numbering may have shifted — no direct PDF access to confirm. Secedit/account_policy mechanics VM-verified on Windows 11 Pro (192.168.64.4, build 26200) 2026-08-08.
