id: "2.3.1.3"
title: "Ensure 'Accounts: Limit local account use of blank passwords to console logon only' is set to Enabled"
description: >
  Restricts accounts with blank passwords to local console logon only (no network/RDP access).
rationale: >
  Without this, a blank-password account is accessible over the network, making brute-force trivial.
benchmark: "CIS Microsoft Windows 11 Standalone Benchmark"
benchmark_version: "v3.0.0"
level: 1
profile:
  - standalone
automated: true
severity: high
checks:
  - type: registry
    path: "HKLM:\\System\\CurrentControlSet\\Control\\Lsa"
    name: LimitBlankPasswordUse
    expected: "1"
    op: equals
remediation: >
  Set HKLM\System\CurrentControlSet\Control\Lsa\LimitBlankPasswordUse (REG_DWORD) = 1.
source: >
  Control ID 2.3.1.3, registry path, and expected value (LimitBlankPasswordUse=1) cross-referenced via ansible-lockdown/Windows-11-CIS (tasks/section_2/cis_2.3.1.x.yml, which targets CIS Windows 11 benchmark v3.0.0). NOTE: current CIS Windows 11 Standalone benchmark is v5.0.0 (confirmed on cisecurity.org); the ansible-lockdown ref targets v3.0.0 and control numbering may have shifted — no direct PDF access to confirm. Registry mechanics VM-verified on Windows 11 Pro (192.168.64.4, build 26200) 2026-08-08.
