id: "2.3.6.1"
title: "Ensure 'Domain member: Digitally encrypt or sign secure channel data (always)' is Enabled"
benchmark: "CIS Microsoft Windows 11 Standalone Benchmark"
benchmark_version: "v3.0.0"
level: 1
profile:
  - standalone
automated: true
severity: high
checks:
  - type: registry
    path: "HKLM:\\System\\CurrentControlSet\\Services\\Netlogon\\Parameters"
    name: RequireSignOrSeal
    expected: "1"
    op: equals
remediation: >
  Set registry value: HKLM:\System\CurrentControlSet\Services\Netlogon\Parameters\RequireSignOrSeal = 1 (REG_DWORD). Via PowerShell: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Services\Netlogon\Parameters' -Name 'RequireSignOrSeal' -Value 1 -Type DWord -Force
source: >
