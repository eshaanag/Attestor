id: "7.1.1"
title: "Ensure permissions on /etc/crontab are configured"
rationale: >
  /etc/crontab controls system-wide scheduled tasks and must be restricted to root.
benchmark: "CIS Ubuntu Linux 22.04 LTS Benchmark"
benchmark_version: "v2.0.0"
level: 1
profile:
  - server
  - workstation
automated: true
severity: medium
checks:
  - type: file_permission
    path: /etc/crontab
    expected: "0600"
    owner: root
    group: root
    op: equals
remediation: >
  Run: chmod 600 /etc/crontab && chown root:root /etc/crontab
source: >
  Control ID 7.1.1, cross-referenced via reference/UBUNTU22-CIS-Audit (which targets CIS Ubuntu 22.04 LTS Benchmark v2.0.0). Manually verified on Ubuntu 22.04.3 LTS VM (192.168.64.3, kernel 5.15.0-87-generic) 2026-08-08.
