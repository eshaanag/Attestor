id: "2.4.1.1"
title: "Ensure cron daemon is enabled and active"
rationale: >
  Cron is required for scheduled security tasks (log rotation, integrity checks).
benchmark: "CIS Ubuntu Linux 22.04 LTS Benchmark"
benchmark_version: "v2.0.0"
level: 1
profile:
  - server
  - workstation
automated: true
severity: medium
checks:
  - type: service_state
    name: cron
    expected: enabled
    op: equals
remediation: >
  Ensure cron package is installed and enabled: sudo systemctl enable cron
source: >
  Control ID 2.4.1.1, cross-referenced via reference/UBUNTU22-CIS-Audit (which targets CIS Ubuntu 22.04 LTS Benchmark v2.0.0). Manually verified on Ubuntu 22.04.3 LTS VM (192.168.64.3, kernel 5.15.0-87-generic) 2026-08-08.
