id: "5.4.1.4"
title: "Ensure default user umask is 027 or more restrictive"
benchmark: "CIS Ubuntu Linux 22.04 LTS Benchmark"
benchmark_version: "v2.0.0"
level: 1
profile:
  - server
  - workstation
automated: true
severity: medium
checks:
  - type: config_grep
    path: /etc/login.defs
    pattern: "^UMASK\\s+027"
    op: matches
    ignore_comments: true
remediation: >
  Set UMASK 027 in /etc/login.defs
source: >
  Control ID 5.4.1.4, cross-referenced via reference/UBUNTU22-CIS-Audit (CIS Ubuntu 22.04 LTS Benchmark v2.0.0). Manually verified on Ubuntu 22.04.3 LTS VM (192.168.64.3) 2026-08-11.
