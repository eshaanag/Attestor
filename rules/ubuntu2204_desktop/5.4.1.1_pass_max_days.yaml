id: "5.4.1.1"
title: "Ensure password expiration is 365 days or less"
benchmark: "CIS Ubuntu Linux 22.04 LTS Benchmark"
benchmark_version: "v2.0.0"
level: 1
profile:
  - server
  - workstation
automated: true
severity: medium
checks:
  - type: config_grep
    path: /etc/login.defs
    pattern: "^PASS_MAX_DAYS\\s+(3[0-5][0-9]|[12][0-9]{2}|[1-9][0-9]|[1-9])$"
    op: matches
    ignore_comments: true
remediation: >
  Set PASS_MAX_DAYS 365 in /etc/login.defs
source: >
  Control ID 5.4.1.1, cross-referenced via reference/UBUNTU22-CIS-Audit (CIS Ubuntu 22.04 LTS Benchmark v2.0.0). Manually verified on Ubuntu 22.04.3 LTS VM (192.168.64.3) 2026-08-11.
