id: "1.5.4"
title: "Ensure kernel dmesg access is restricted"
benchmark: "CIS Ubuntu Linux 22.04 LTS Benchmark"
benchmark_version: "v2.0.0"
level: 2
profile:
  - server
  - workstation
automated: true
severity: medium
checks:
  - type: sysctl
    key: kernel.dmesg_restrict
    expected: "1"
    op: equals
remediation: >
  Set kernel.dmesg_restrict = 1 in /etc/sysctl.d/99-attestor.conf and run sysctl -p
