id: "3.3.1.4"
title: "Ensure packet redirect sending is disabled (all interfaces)"
description: >
  ICMP redirect messages are used to inform hosts of more direct routes. A
  non-router system should not send redirects.
rationale: >
  An attacker could use a compromised host to send crafted ICMP redirect messages
  to manipulate routing tables on neighbouring systems.
benchmark: "CIS Ubuntu Linux 22.04 LTS Benchmark"
benchmark_version: "v2.0.0"
level: 1
profile:
  - server
  - workstation
automated: true
severity: medium
checks:
  - type: sysctl
    key: net.ipv4.conf.all.send_redirects
    expected: "0"
    op: equals
remediation: >
  Set net.ipv4.conf.all.send_redirects = 0 in /etc/sysctl.d/60-attestor-network.conf,
  then: sudo sysctl -w net.ipv4.conf.all.send_redirects=0
source: >
  CIS Ubuntu Linux 22.04 LTS Benchmark v2.0.0, section 3.3.1.4;
  cross-referenced with reference/UBUNTU22-CIS-Audit/section_3/cis_3.3.1/cis_3.3.1.4.yml;
  manually verified on Ubuntu 22.04.3 LTS VM (192.168.64.3) 2026-08-07
