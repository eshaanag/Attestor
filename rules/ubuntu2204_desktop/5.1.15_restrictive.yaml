id: "5.1.15"
title: "Ensure sshd_config permissions are 600 or more restrictive"
benchmark: "CIS Ubuntu Linux 22.04 LTS Benchmark"
benchmark_version: "v2.0.0"
level: 1
profile:
  - server
  - workstation
automated: true
severity: high
checks:
  - type: file_permission
    path: /etc/ssh/sshd_config
    expected: "0600"
    owner: root
    group: root
    op: equals
remediation: >
  Run: chmod 600 /etc/ssh/sshd_config && chown root:root /etc/ssh/sshd_config
source: >
