id: "1.5.2"
title: "Ensure ptrace_scope is restricted"
description: >
  The Yama LSM ptrace_scope setting restricts which processes can ptrace other
  processes. A value of 1 or higher limits ptrace to direct child processes or
  processes with CAP_SYS_PTRACE.
rationale: >
  Unrestricted ptrace (scope 0) allows any process to inspect and modify the
  memory of any other process running as the same user, which attackers can abuse
  for credential theft or code injection.
benchmark: "CIS Ubuntu Linux 22.04 LTS Benchmark"
benchmark_version: "v2.0.0"
level: 1
profile:
  - server
  - workstation
automated: true
severity: medium
checks:
  - type: sysctl
    key: kernel.yama.ptrace_scope
    expected: "[1-3]"
    op: matches
remediation: >
  Set kernel.yama.ptrace_scope = 1 (or higher) in /etc/sysctl.conf or a file
  under /etc/sysctl.d/ (e.g. /etc/sysctl.d/60-attestor-ptrace.conf), then apply:
  sudo sysctl -w kernel.yama.ptrace_scope=1
source: >
  CIS Ubuntu Linux 22.04 LTS Benchmark v2.0.0, section 1.5.2;
  cross-referenced with reference/UBUNTU22-CIS-Audit/section_1/cis_1.5/cis_1.5.2.yml;
  manually verified on Ubuntu 22.04.3 LTS VM (192.168.64.3, kernel 5.15.0-87-generic, aarch64) 2026-08-07
