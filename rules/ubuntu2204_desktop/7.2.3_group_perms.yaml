id: "7.2.3"
title: "Ensure permissions on /etc/group are configured"
rationale: >
  /etc/group must be readable but not writable by non-root.
benchmark: "CIS Ubuntu Linux 22.04 LTS Benchmark"
benchmark_version: "v2.0.0"
level: 1
profile:
  - server
  - workstation
automated: true
severity: medium
checks:
  - type: file_permission
    path: /etc/group
    expected: "0644"
    owner: root
    group: root
    op: equals
remediation: >
  Run: chmod 644 /etc/group && chown root:root /etc/group
source: >
  Control ID 7.2.3, cross-referenced via reference/UBUNTU22-CIS-Audit (which targets CIS Ubuntu 22.04 LTS Benchmark v2.0.0). Manually verified on Ubuntu 22.04.3 LTS VM (192.168.64.3, kernel 5.15.0-87-generic) 2026-08-08.
