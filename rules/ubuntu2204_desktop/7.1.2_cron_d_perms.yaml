id: "7.1.2"
title: "Ensure permissions on /etc/cron.d are configured"
rationale: >
  The /etc/cron.d directory contains system cron job files and must be restricted.
benchmark: "CIS Ubuntu Linux 22.04 LTS Benchmark"
benchmark_version: "v2.0.0"
level: 1
profile:
  - server
  - workstation
automated: true
severity: medium
checks:
  - type: file_permission
    path: /etc/cron.d
    expected: "0700"
    owner: root
    group: root
    op: equals
remediation: >
  Run: chmod 700 /etc/cron.d && chown root:root /etc/cron.d
source: >
  Control ID 7.1.2, cross-referenced via reference/UBUNTU22-CIS-Audit (which targets CIS Ubuntu 22.04 LTS Benchmark v2.0.0). Manually verified on Ubuntu 22.04.3 LTS VM (192.168.64.3, kernel 5.15.0-87-generic) 2026-08-08.
