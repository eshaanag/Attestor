id: "2.1.11"
title: "Ensure print server services are not in use (package)"
description: >
  The cups package provides the Common UNIX Printing System. If printing is not needed, this package should not be installed.
rationale: >
  If the system does not need to print, removing cups eliminates a network-accessible service that has had multiple CVEs.
benchmark: "CIS Ubuntu Linux 22.04 LTS Benchmark"
benchmark_version: "v2.0.0"
level: 1
profile:
  - server
  - workstation
automated: true
severity: medium
checks:
  - type: package_installed
    name: cups
    op: absent
remediation: >
  Run: sudo apt purge cups
source: >
  Control ID 2.1.11, cross-referenced via reference/UBUNTU22-CIS-Audit (which targets CIS Ubuntu 22.04 LTS Benchmark v2.0.0). Manually verified on Ubuntu 22.04.3 LTS VM (192.168.64.3, kernel 5.15.0-87-generic) 2026-08-08.
