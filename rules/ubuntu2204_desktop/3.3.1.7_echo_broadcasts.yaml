id: "3.3.1.7"
title: "Ensure broadcast ICMP requests are ignored"
description: >
  Setting icmp_echo_ignore_broadcasts to 1 prevents the system from responding to
  ICMP echo requests sent to broadcast or multicast addresses (Smurf attack mitigation).
rationale: >
  Responding to broadcast pings can be abused for amplification attacks (Smurf)
  and reveals host presence to network scanners.
benchmark: "CIS Ubuntu Linux 22.04 LTS Benchmark"
benchmark_version: "v2.0.0"
level: 1
profile:
  - server
  - workstation
automated: true
severity: low
checks:
  - type: sysctl
    key: net.ipv4.icmp_echo_ignore_broadcasts
    expected: "1"
    op: equals
remediation: >
  Set net.ipv4.icmp_echo_ignore_broadcasts = 1 in
  /etc/sysctl.d/60-attestor-network.conf, then:
  sudo sysctl -w net.ipv4.icmp_echo_ignore_broadcasts=1
source: >
  CIS Ubuntu Linux 22.04 LTS Benchmark v2.0.0, section 3.3.1.7;
  cross-referenced with reference/UBUNTU22-CIS-Audit/section_3/cis_3.3.1/cis_3.3.1.7.yml;
  manually verified on Ubuntu 22.04.3 LTS VM (192.168.64.3) 2026-08-07
