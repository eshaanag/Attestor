id: "3.3.1.14"
title: "Ensure ICMP redirect messages are not accepted (default)"
rationale: >
  Reject ICMP redirects on default interfaces.
benchmark: "CIS Ubuntu Linux 22.04 LTS Benchmark"
benchmark_version: "v2.0.0"
level: 1
profile:
  - server
  - workstation
automated: true
severity: medium
checks:
  - type: sysctl
    key: net.ipv4.conf.default.accept_redirects
    expected: "0"
    op: equals
remediation: >
  Set net.ipv4.conf.default.accept_redirects = 0 in /etc/sysctl.d/60-attestor-network.conf
source: >
  Control ID 3.3.1.14, cross-referenced via reference/UBUNTU22-CIS-Audit (which targets CIS Ubuntu 22.04 LTS Benchmark v2.0.0). Manually verified on Ubuntu 22.04.3 LTS VM (192.168.64.3, kernel 5.15.0-87-generic) 2026-08-08.
