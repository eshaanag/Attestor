id: "7.2.6"
title: "Ensure permissions on /etc/shadow- are configured"
benchmark: "CIS Ubuntu Linux 22.04 LTS Benchmark"
benchmark_version: "v2.0.0"
level: 1
profile:
  - server
  - workstation
automated: true
severity: high
checks:
  - type: file_permission
    path: /etc/shadow-
    expected: "0640"
    owner: root
    group: shadow
    op: equals
remediation: >
  Run: chmod 640 /etc/shadow- && chown root:shadow /etc/shadow-
source: >
