id: "5.1.7"
title: "Ensure sshd ClientAliveCountMax is configured"
benchmark: "CIS Ubuntu Linux 22.04 LTS Benchmark"
benchmark_version: "v2.0.0"
level: 1
profile:
  - server
  - workstation
automated: true
severity: medium
checks:
  - type: config_grep
    path: /etc/ssh/sshd_config
    pattern: "^ClientAliveCountMax\\s+[0-3]$"
    op: matches
    ignore_comments: true
remediation: >
  Set ClientAliveCountMax 3 in /etc/ssh/sshd_config
source: >
  Control ID 5.1.7, cross-referenced via reference/UBUNTU22-CIS-Audit (CIS Ubuntu 22.04 LTS Benchmark v2.0.0). Manually verified on Ubuntu 22.04.3 LTS VM (192.168.64.3) 2026-08-11.
