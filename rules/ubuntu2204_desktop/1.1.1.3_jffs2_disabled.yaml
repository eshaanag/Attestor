id: "1.1.1.3"
title: "Ensure jffs2 kernel module is not available"
rationale: >
  JFFS2 is a flash filesystem rarely needed on server/desktop systems.
benchmark: "CIS Ubuntu Linux 22.04 LTS Benchmark"
benchmark_version: "v2.0.0"
level: 1
profile:
  - server
  - workstation
automated: true
severity: low
checks:
  - type: kernel_module
    name: jffs2
    op: absent
remediation: >
  Create /etc/modprobe.d/CIS.conf with 'install jffs2 /bin/false' and 'blacklist jffs2'
source: >
  Control ID 1.1.1.3, cross-referenced via reference/UBUNTU22-CIS-Audit (which targets CIS Ubuntu 22.04 LTS Benchmark v2.0.0). Manually verified on Ubuntu 22.04.3 LTS VM (192.168.64.3, kernel 5.15.0-87-generic) 2026-08-08.
