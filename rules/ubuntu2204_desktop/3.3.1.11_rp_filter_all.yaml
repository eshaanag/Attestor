id: "3.3.1.11"
title: "Ensure net.ipv4.conf.all.rp_filter is enabled"
rationale: >
  Reverse path filtering validates that the source of a packet is reachable via the interface it arrived on.
benchmark: "CIS Ubuntu Linux 22.04 LTS Benchmark"
benchmark_version: "v2.0.0"
level: 1
profile:
  - server
  - workstation
automated: true
severity: medium
checks:
  - type: sysctl
    key: net.ipv4.conf.all.rp_filter
    expected: "1"
    op: equals
remediation: >
  Set net.ipv4.conf.all.rp_filter = 1 in /etc/sysctl.d/60-attestor-network.conf
source: >
  Control ID 3.3.1.11, cross-referenced via reference/UBUNTU22-CIS-Audit (which targets CIS Ubuntu 22.04 LTS Benchmark v2.0.0). Manually verified on Ubuntu 22.04.3 LTS VM (192.168.64.3, kernel 5.15.0-87-generic) 2026-08-08.
