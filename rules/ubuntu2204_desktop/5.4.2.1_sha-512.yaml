id: "5.4.2.1"
title: "Ensure password hashing algorithm is SHA-512"
benchmark: "CIS Ubuntu Linux 22.04 LTS Benchmark"
benchmark_version: "v2.0.0"
level: 1
profile:
  - server
  - workstation
automated: true
severity: high
checks:
  - type: config_grep
    path: /etc/login.defs
    pattern: "^ENCRYPT_METHOD\\s+SHA512"
    op: matches
    ignore_comments: true
remediation: >
  Configure the required setting in /etc/login.defs
source: >
  Control ID 5.4.2.1, cross-referenced via reference/UBUNTU22-CIS-Audit (CIS Ubuntu 22.04 LTS Benchmark v2.0.0). VM-verified on Ubuntu 22.04 (192.168.64.6) 2026-08-15.
