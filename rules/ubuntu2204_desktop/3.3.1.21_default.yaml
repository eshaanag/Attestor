id: "3.3.1.21"
title: "Ensure source-routed packets are not accepted (default)"
benchmark: "CIS Ubuntu Linux 22.04 LTS Benchmark"
benchmark_version: "v2.0.0"
level: 1
profile:
  - server
  - workstation
automated: true
severity: medium
checks:
  - type: sysctl
    key: net.ipv4.conf.default.accept_source_route
    expected: "0"
    op: equals
remediation: >
  Set net.ipv4.conf.default.accept_source_route = 0 in /etc/sysctl.d/99-attestor.conf and run sysctl -p
