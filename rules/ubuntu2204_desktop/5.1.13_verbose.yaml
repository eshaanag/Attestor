id: "5.1.13"
title: "Ensure sshd LogLevel is set to INFO or VERBOSE"
benchmark: "CIS Ubuntu Linux 22.04 LTS Benchmark"
benchmark_version: "v2.0.0"
level: 2
profile:
  - server
  - workstation
automated: true
severity: medium
checks:
  - type: config_grep
    path: /etc/ssh/sshd_config
    pattern: "^LogLevel\\s+(INFO|VERBOSE)"
    op: matches
    ignore_comments: true
remediation: >
  Configure the required setting in /etc/ssh/sshd_config
source: >
  Control ID 5.1.13, cross-referenced via reference/UBUNTU22-CIS-Audit (CIS Ubuntu 22.04 LTS Benchmark v2.0.0, Level 2). VM-verified on Ubuntu 22.04 (192.168.64.6) 2026-08-15.
