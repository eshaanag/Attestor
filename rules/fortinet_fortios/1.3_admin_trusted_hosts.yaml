id: "1.3"
id_namespace: "fortios-baseline"
title: "Restrict every administrator account to trusted hosts"
description: "Every observed FortiOS administrator entry should contain a non-any trusted-host restriction."
rationale: "Restricting administrative logins to known management networks reduces exposure of privileged authentication services."
benchmark: "Fortinet FortiOS Security Baseline (vendor documentation)"
benchmark_version: "2026-08"
level: 1
profile: [network_device]
device: {vendor: Fortinet, platform: FortiOS, config_format: fortios-cli}
automated: true
severity: high
checks:
  - type: fortios_statement
    path_pattern: "(?:.*/)?system admin"
    target: statement
    pattern: "set (?:trusthost[1-9]|ip6-trusthost[1-9])\\s+(?!0\\.0\\.0\\.0\\s+0\\.0\\.0\\.0|::/0).+"
    op: all_entries_match
remediation: "For each administrator, enter `config system admin`, `edit <administrator>`, then set a trusted management source such as `set trusthost1 <network> <netmask>` (or the corresponding IPv6 trusted-host command). Verify access from the approved management network before closing the current session."
source: "Fortinet FortiOS 7.6.0 Best Practices, Hardening, Blocking external access to administrative ports: https://docs.fortinet.com/document/fortigate/7.6.0/best-practices/555436/hardening; corpus oracle tests/fixtures/network/fortios/manual_expectations.json"
framework_mappings:
  - {framework: "NIST SP 800-53", version: "Rev. 5", control_id: "AC-3", relationship: "supporting", source: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"}
  - {framework: "NIST SP 800-53", version: "Rev. 5", control_id: "AC-17", relationship: "supporting", source: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"}
