services:
  - type: web
    name: attestor-network
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn dashboard.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ATTESTOR_DASHBOARD_DATA_DIR
        value: /data
    disk:
      name: attestor-data
      mountPath: /data
      sizeGB: 1
